<!DOCTYPE html>
<html>
<head>
  <title>Task List</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #d9e4ec);
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    h2 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8em;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 800px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    }
    thead {
      background: #007bff;
      color: #fff;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      font-size: 14px;
    }
    tr:nth-child(even) {
      background: #f9f9f9;
    }
    tr:hover {
      background: #eef6ff;
    }
    button {
      padding: 6px 12px;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    button:hover {
      background: linear-gradient(135deg, #c0392b, #96281b);
      transform: scale(1.05);
    }
    #taskTable {
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div>
  <h2>Task List</h2>
  <table id="taskTable">
    <thead>
      <tr>
        <th>Title</th>
        <th>Priority</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="taskBody"></tbody>
  </table>
</div>

<script>
async function loadTasks(){
  try{
    const res = await fetch("http://localhost:5000/api/tasks");
    const data = await res.json();
    const tasks = data.tasks;  
    const tbody = document.getElementById("taskBody");

    tasks.forEach(task => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${task.title}</td>
        <td>${task.priority}</td>
        <td>${task.status}</td>
        <td>
          <button onclick="deleteTask('${task._id}')">Delete</button>
        </td>
      `;
      tbody.appendChild(row);
    });
  }
  catch(err){
    console.log(err);
  }
}

document.addEventListener("DOMContentLoaded", loadTasks);
</script>

</body>
</html>
